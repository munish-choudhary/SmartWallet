# Config for `dart run ffigen --config ffigen.yaml`.
#
# This does NOT run yet: `headers.entry-points` points at files that must be
# vendored first. See README.md for the vendoring + build steps. Once the
# headers exist and ffigen is run, it produces lib/src/generated_bindings.dart,
# which lib/wallet_core_ffi.dart's TODO integration point will call into.

name: WalletCoreBindings
description: >
  Bindings to Trust Wallet Core's public C API (TWHDWallet, TWMnemonic,
  TWPrivateKey, TWAnySigner, TWCoinType, ...).
output: "lib/src/generated_bindings.dart"

headers:
  entry-points:
    # Vendor Trust Wallet Core's `include/TrustWalletCore/*.h` into src/
    # before running ffigen. Not present yet — see README.md.
    - "src/TrustWalletCore/TWHDWallet.h"
    - "src/TrustWalletCore/TWMnemonic.h"
    - "src/TrustWalletCore/TWPrivateKey.h"
    - "src/TrustWalletCore/TWPublicKey.h"
    - "src/TrustWalletCore/TWAnySigner.h"
    - "src/TrustWalletCore/TWCoinType.h"
    - "src/TrustWalletCore/TWAnyAddress.h"
  include-directives:
    - "src/TrustWalletCore/**"

functions:
  include:
    - "TWHDWallet.*"
    - "TWMnemonic.*"
    - "TWPrivateKey.*"
    - "TWPublicKey.*"
    - "TWAnySigner.*"
    - "TWAnyAddress.*"

enums:
  include:
    - "TWCoinType"
    - "TWCurve"
    - "TWHDVersion"

structs:
  rename:
    "struct TWHDWallet": "TWHDWallet"

comments:
  style: any
  length: full

preamble: |
  // Generated by ffigen. Do not edit by hand.
  // Regenerate with: dart run ffigen --config ffigen.yaml
  // ignore_for_file: type=lint
