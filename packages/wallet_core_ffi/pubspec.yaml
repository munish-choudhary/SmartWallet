name: wallet_core_ffi
description: >
  Dart FFI bindings to Trust Wallet Core's C API, used exclusively by
  lib/core/vault. No other package or feature should depend on this directly.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^13.0.0
  lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
